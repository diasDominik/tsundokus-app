name: Release

# Builds the Android App Bundle and APK for a version tag and uploads the bundle to the Play Store
# internal track. Once Play has accepted it, the APK is published as a GitHub release.
#
# The two are signed differently. The bundle uses the upload key and Play re-signs it for its users;
# the APK uses the distribution key. Android only updates an app with the certificate it was
# installed with, so moving between a Play install and an APK install means uninstalling first.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version, and nothing else sets it: Gradle reads it from git (appVersion in
# build-logic), so v1.2.3 builds versionName 1.2.3, versionCode 10203. Play rejects a versionCode
# it has seen before, so every release needs a higher tag than the last one.
#
# Run it from the Actions tab instead (workflow_dispatch) for a dry run: same builds and signature
# checks on an untagged commit (version "<latest tag>-dev"), the outputs are kept as a workflow
# artifact, nothing is released or uploaded.
#
# Repository secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64         upload_keystore.jks, base64-encoded
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD       keystore + key password (alias "upload")
#   ANDROID_DISTRIBUTION_KEYSTORE_BASE64   distribution_keystore.jks, base64-encoded
#   ANDROID_DISTRIBUTION_KEYSTORE_PASSWORD keystore + key password (alias "distribution")
#   API_KEY                                production API key the app sends as x-api-key
#   BASE_URL_HTTP                          server base URL the app talks to
#   PLAY_SERVICE_ACCOUNT_JSON              Google Play service account key (release only)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  API_KEY: ${{ secrets.API_KEY }}
  BASE_URL_HTTP: ${{ secrets.BASE_URL_HTTP }}
  # SHA-256 of the signing certificates. The release build falls back to the debug key when the
  # signing secrets are missing, so each output's certificate is checked before anything ships.
  UPLOAD_CERT_SHA256: "CF:12:35:9B:1B:4F:78:18:2F:8E:D2:EE:8B:40:44:D6:BF:D3:8F:8A:10:CE:17:EA:49:0F:51:A8:A4:6C:74:5A"
  DISTRIBUTION_CERT_SHA256: "A4:CA:0C:57:06:D3:36:44:1B:E9:CA:D2:A8:D1:A4:AC:78:BF:AB:C0:D9:CC:9E:F3:53:C0:07:78:37:56:D2:46"

jobs:
  build:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history with tags: the version comes from git describe.
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Resolve version
        id: version
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not a version like v1.2.3 (each part 0-99, it becomes the versionCode)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          DISTRIBUTION_KEYSTORE: ${{ secrets.ANDROID_DISTRIBUTION_KEYSTORE_BASE64 }}
          DISTRIBUTION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DISTRIBUTION_KEYSTORE_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE" ]] || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_UPLOAD_KEYSTORE_PASSWORD)
          [[ -n "$DISTRIBUTION_KEYSTORE" ]] || missing+=(ANDROID_DISTRIBUTION_KEYSTORE_BASE64)
          [[ -n "$DISTRIBUTION_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_DISTRIBUTION_KEYSTORE_PASSWORD)
          [[ -n "$API_KEY" ]] || missing+=(API_KEY)
          [[ -n "$BASE_URL_HTTP" ]] || missing+=(BASE_URL_HTTP)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode keystores
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          DISTRIBUTION_KEYSTORE: ${{ secrets.ANDROID_DISTRIBUTION_KEYSTORE_BASE64 }}
        run: |
          mkdir -p androidApp/keystore
          base64 --decode <<< "$KEYSTORE" > androidApp/keystore/upload_keystore.jks
          base64 --decode <<< "$DISTRIBUTION_KEYSTORE" > androidApp/keystore/distribution_keystore.jks

      - name: Build App Bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: upload
        run: ./gradlew :androidApp:bundleRelease --no-daemon --no-configuration-cache --no-build-cache

      - name: Build APK
        env:
          SIGNING_STORE_FILE: keystore/distribution_keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_DISTRIBUTION_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_DISTRIBUTION_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: distribution
        run: ./gradlew :androidApp:assembleRelease --no-daemon --no-configuration-cache --no-build-cache

      - name: Verify signatures and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab
          signer=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          if [[ "$signer" != "$UPLOAD_CERT_SHA256" ]]; then
            echo "::error::Bundle is signed with $signer, not the upload certificate"
            exit 1
          fi
          echo "Bundle signed with the upload certificate"
          # An APK may carry only v2+ signatures, which keytool can't read.
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk_signer=$("$build_tools/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected=$(tr -d ':' <<< "$DISTRIBUTION_CERT_SHA256" | tr 'A-F' 'a-f')
          if [[ "$apk_signer" != "$expected" ]]; then
            echo "::error::APK is signed with $apk_signer, not the distribution certificate"
            exit 1
          fi
          echo "APK signed with the distribution certificate"
          # Tag runs only: Gradle must have picked the version up from the tag. The bundle
          # manifest is protobuf, so the versionName shows up as a string with binary bytes
          # around it; match it as a version not embedded in a longer one.
          if [[ -n "$VERSION" ]]; then
            manifest=$(unzip -p "$aab" base/manifest/AndroidManifest.xml | strings)
            grep -qE "(^|[^0-9.])${VERSION//./\\.}([^0-9.]|$)" <<< "$manifest" \
              || { echo "::error::versionName $VERSION not found in the bundle"; exit 1; }
            "$build_tools/aapt2" dump badging "$apk" | grep -qF "versionName='$VERSION'" \
              || { echo "::error::versionName $VERSION not found in the APK"; exit 1; }
            echo "versionName $VERSION"
          fi
          rm -f androidApp/keystore/upload_keystore.jks androidApp/keystore/distribution_keystore.jks

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: tsundoku-${{ steps.version.outputs.version || 'dry-run' }}
          path: |
            androidApp/build/outputs/bundle/release/androidApp-release.aab
            androidApp/build/outputs/apk/release/androidApp-release.apk
            androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

  play-store:
    name: Play Store (internal)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: tsundoku-${{ needs.build.outputs.version }}

      - name: Upload to internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.tsundokus
          releaseFiles: bundle/release/androidApp-release.aab
          mappingFile: mapping/release/mapping.txt
          tracks: internal

  github-release:
    name: GitHub release
    needs: [build, play-store]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: tsundoku-${{ needs.build.outputs.version }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mv apk/release/androidApp-release.apk "tsundoku-$VERSION.apk"
          # The release already exists when the tag came from publishing it on GitHub, or when this
          # job is re-run: attach the APK and leave its title and notes alone.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "tsundoku-$VERSION.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "tsundoku-$VERSION.apk" \
              --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag
          fi
