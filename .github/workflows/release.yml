name: Release

# Builds the signed Android App Bundle for a version tag, uploads it to the Play Store internal
# track and, once Play has accepted it, publishes it as a GitHub release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version: v1.2.3 -> versionName 1.2.3, versionCode 10203. Play rejects a
# versionCode it has seen before, so every release needs a higher tag than the last one.
#
# Run it from the Actions tab instead (workflow_dispatch) for a dry run: same build and checks,
# the bundle is kept as a workflow artifact, nothing is released or uploaded.
#
# Repository secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64   upload_keystore.jks, base64-encoded
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD keystore + key password (alias "upload")
#   API_KEY                          production API key the app sends as x-api-key
#   PLAY_SERVICE_ACCOUNT_JSON        Google Play service account key (release only)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for the dry run (x.y.z)"
        required: true
        default: "0.0.1"

concurrency:
  group: release
  cancel-in-progress: false

env:
  BASE_URL_HTTP: https://tsundokus.uk
  # SHA-256 of the upload certificate. The release build falls back to the debug key when the
  # signing secrets are missing, so the bundle's certificate is checked before anything ships.
  UPLOAD_CERT_SHA256: "CF:12:35:9B:1B:4F:78:18:2F:8E:D2:EE:8B:40:44:D6:BF:D3:8F:8A:10:CE:17:EA:49:0F:51:A8:A4:6C:74:5A"

jobs:
  build:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Resolve version
        id: version
        env:
          RAW_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::'$RAW_VERSION' is not a version like v1.2.3 (each part 0-99, it becomes the versionCode)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          missing=()
          [[ -n "$KEYSTORE" ]] || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_UPLOAD_KEYSTORE_PASSWORD)
          [[ -n "$API_KEY" ]] || missing+=(API_KEY)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p androidApp/keystore
          base64 --decode <<< "$KEYSTORE" > androidApp/keystore/upload_keystore.jks

      - name: Build App Bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_APP_VERSION: ${{ steps.version.outputs.version }}
          API_KEY: ${{ secrets.API_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: upload
        run: ./gradlew :androidApp:bundleRelease --no-daemon --no-configuration-cache --no-build-cache

      - name: Verify signature and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab
          signer=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          if [[ "$signer" != "$UPLOAD_CERT_SHA256" ]]; then
            echo "::error::Bundle is signed with $signer, not the upload certificate"
            exit 1
          fi
          # The bundle manifest is protobuf: the versionName shows up as a string with binary
          # bytes around it, so match it as a version not embedded in a longer one.
          manifest=$(unzip -p "$aab" base/manifest/AndroidManifest.xml | strings)
          grep -qE "(^|[^0-9.])${VERSION//./\\.}([^0-9.]|$)" <<< "$manifest" \
            || { echo "::error::versionName $VERSION not found in the bundle"; exit 1; }
          echo "Signed with the upload certificate, version $VERSION"
          rm -f androidApp/keystore/upload_keystore.jks

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: tsundoku-${{ steps.version.outputs.version }}
          path: |
            androidApp/build/outputs/bundle/release/androidApp-release.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

  play-store:
    name: Play Store (internal)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: tsundoku-${{ needs.build.outputs.version }}

      - name: Upload to internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.tsundokus
          releaseFiles: bundle/release/androidApp-release.aab
          mappingFile: mapping/release/mapping.txt
          track: internal

  github-release:
    name: GitHub release
    needs: [build, play-store]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: tsundoku-${{ needs.build.outputs.version }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mv bundle/release/androidApp-release.aab "tsundoku-$VERSION.aab"
          gh release create "$GITHUB_REF_NAME" "tsundoku-$VERSION.aab" \
            --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag
