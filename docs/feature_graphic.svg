<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="500" fill="#9A4A00" />

  <!-- Decorative Background Pattern (Simple dots) -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#FFF8F4" fill-opacity="0.1" />
  </pattern>
  <rect width="1024" height="500" fill="url(#dots)" />

  <!-- Centered Content -->
  <g transform="translate(512, 250)">
    <!-- Main Title -->
    <text text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="120" fill="#FFF8F4">Tsundoku</text>

    <!-- Subtitle -->
    <text y="80" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#FFDCBE">Track your manga orders from checkout to bookshelf.</text>

    <!-- Decorative underline -->
    <rect x="-150" y="20" width="300" height="4" fill="#D2762A" />
  </g>

  <!-- "Pile" Illustration (Simple stack of rectangles representing manga volumes) -->
  <g transform="translate(850, 400)">
    <rect x="-60" y="-20" width="120" height="20" rx="2" fill="#FBE9C7" />
    <rect x="-60" y="-45" width="120" height="20" rx="2" fill="#D2762A" />
    <rect x="-60" y="-70" width="120" height="20" rx="2" fill="#612000" />
    <rect x="-60" y="-95" width="120" height="20" rx="2" fill="#FBE9C7" />
  </g>
</svg>
